name: Validate Skill Packages

on:
  pull_request:
    paths:
      - 'skills/**'
      - '.github/workflows/validate-skills.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install --no-input pyyaml==6.0.2
      - name: Validate SKILL.md frontmatter
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys, yaml

          ROOT = 'skills'
          REQUIRED = ['name', 'description']
          ALLOWED_TOOLS = {
              'bash', 'edit', 'find', 'grep', 'ls', 'read', 'write',
              'web_extract', 'web_search', 'subagent',
          }
          errors = []
          checked = 0

          for folder, _, files in os.walk(ROOT):
              for fname in files:
                  if fname != 'SKILL.md':
                      continue
                  path = os.path.join(folder, fname)
                  checked += 1
                  with open(path, encoding='utf-8') as fh:
                      text = fh.read()

                  m = re.match(r'^---\n(.*?)\n---\n', text, re.DOTALL)
                  if not m:
                      errors.append(f'{path}: missing YAML frontmatter delimiters')
                      continue
                  try:
                      fm = yaml.safe_load(m.group(1)) or {}
                  except yaml.YAMLError as e:
                      errors.append(f'{path}: invalid YAML — {e}')
                      continue

                  if not isinstance(fm, dict):
                      errors.append(f'{path}: frontmatter is not a mapping')
                      continue

                  for key in REQUIRED:
                      if not fm.get(key):
                          errors.append(f'{path}: missing required field {key!r}')

                  folder_name = os.path.basename(folder)
                  if fm.get('name') and fm['name'] != folder_name:
                      errors.append(
                          f'{path}: name {fm["name"]!r} does not match folder {folder_name!r}'
                      )

                  meta = (fm.get('metadata') or {}).get('ohmyagent') or {}
                  tools = meta.get('tools') or []
                  if not isinstance(tools, list):
                      errors.append(
                          f'{path}: metadata.ohmyagent.tools must be a list, got {type(tools).__name__}'
                      )
                      continue
                  unknown_tools = [t for t in tools if t not in ALLOWED_TOOLS]
                  if unknown_tools:
                      errors.append(
                          f'{path}: unknown OhMyAgent tool(s): {unknown_tools}. '
                          f'Allowed: {sorted(ALLOWED_TOOLS)}'
                      )

          print(f'Checked {checked} SKILL.md file(s).')
          if errors:
              print('\nValidation errors:', file=sys.stderr)
              for e in errors:
                  print(f'  - {e}', file=sys.stderr)
              sys.exit(1)
          print('All skill packages valid.')
          PY
