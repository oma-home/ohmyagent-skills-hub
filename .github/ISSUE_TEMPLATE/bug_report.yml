name: Bug Report
description: Report something that is broken or behaves incorrectly
title: "[bug] "
labels: ["bug", "status:triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem. Include the smallest reproducible example you can.
      placeholder: "When I ... I expected ... but instead ..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered list. Be specific.
      placeholder: |
        1. Go to ...
        2. Run ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Tag, commit hash, or branch where this reproduces.
      placeholder: "v1.2.3 / commit abc1234 / main"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime, app version, browser, or anything else that matters.
      placeholder: "macOS 14 / Node 20 / Python 3.12"
    validations:
      required: false
